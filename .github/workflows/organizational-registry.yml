name: Organizational registry validation and live evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "40 7 * * 1"
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registry and classification
        run: |
          python3 -m unittest scripts.test_agent_registry scripts.test_agent_registry_live -v
          python3 scripts/agent_registry.py --output artifacts/agent-registry/report.json
      - name: Fetch live GitHub Actions evidence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/agent_registry_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: organizational-agent-registry
          path: artifacts/agent-registry/
