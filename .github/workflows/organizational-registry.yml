name: Organizational registry validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest scripts.test_agent_registry -v
      - run: python3 scripts/agent_registry.py --output artifacts/agent-registry/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: organizational-agent-registry
          path: artifacts/agent-registry/report.json
