name: Growth Agents (read-only MVP)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/growth_agents.py'
      - 'scripts/test_growth_agents.py'
      - 'scripts/agent_issue_reporting.py'
      - 'scripts/test_agent_issue_reporting.py'
      - 'scripts/deliver_growth_agents_report.py'
      - 'scripts/test_deliver_growth_agents_report.py'
      - 'tools/learning-intelligence/ga4.py'
      - 'tools/learning-intelligence/search_console.py'
      - '.github/workflows/growth-agents.yml'
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          python3 -m unittest scripts.test_growth_agents -v
          python3 -m unittest scripts.test_agent_issue_reporting -v
          python3 -m unittest scripts.test_deliver_growth_agents_report -v
      - name: Install optional real-data connector dependencies
        # Same packages, same secrets, as the already-approved GA4/Search
        # Console connectors used by Learning Intelligence - no new cost,
        # no new credentials. Installed unconditionally (tiny, pure-Python
        # deps) so growth_agents.py's own connector-missing detection (not
        # an import error) is what decides whether a connector ran.
        run: python3 -m pip install google-auth==2.38.0 requests==2.32.3
      - name: Generate five read-only agent reports
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: python3 scripts/growth_agents.py
      - name: Upload reports for human/Claude review
        uses: actions/upload-artifact@v4
        with:
          name: money-quest-growth-agents
          path: artifacts/growth-agents/*.json
          retention-days: 30
      - name: Deliver summary to Claude through one stable GitHub issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/deliver_growth_agents_report.py
