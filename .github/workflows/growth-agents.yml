name: Growth Agents (read-only MVP)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate five read-only agent reports
        run: python3 scripts/growth_agents.py
      - name: Upload reports for human/Claude review
        uses: actions/upload-artifact@v4
        with:
          name: money-quest-growth-agents
          path: artifacts/growth-agents/*.json
          retention-days: 30
