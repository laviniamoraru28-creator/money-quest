name: Learning Intelligence (research only)
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'tools/learning-intelligence/**'
      - '.github/workflows/learning-intelligence.yml'
      - 'docs/learning-intelligence.md'
  schedule:
    - cron: "17 7 * * 1"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tools/learning-intelligence -p 'test_*.py'
      - name: Optional Search Console collection
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ github.event_name != 'pull_request' && secrets.GSC_SERVICE_ACCOUNT_JSON || '' }}
          GSC_SITE_URL: ${{ github.event_name != 'pull_request' && vars.GSC_SITE_URL || '' }}
        run: |
          if [[ -n "$GSC_SERVICE_ACCOUNT_JSON" && -n "$GSC_SITE_URL" ]]; then
            python3 -m pip install google-auth==2.38.0 requests==2.32.3
            python3 tools/learning-intelligence/search_console.py --output "$RUNNER_TEMP/mq-search-console.csv"
            python3 tools/learning-intelligence/analyze.py --search-console-csv "$RUNNER_TEMP/mq-search-console.csv"
          else
            python3 tools/learning-intelligence/analyze.py
            echo "Search Console credentials unavailable: report marks search data as not connected." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summary
        run: cat test-results/learning-intelligence/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: learning-intelligence-evidence
          path: test-results/learning-intelligence/
          retention-days: 35
