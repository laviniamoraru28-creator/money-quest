name: TikTok Studio (Money Quest videos)

# Separate from the website: this workflow only touches tiktok-studio/ and
# stores its memory (which topics were used, TikTok post ids, metrics) on
# its own branch `tiktok-studio-state`, so it never pushes to main and never
# triggers a website build.
#
# Scheduled runs only fire from the default branch (GitHub rule).
# Until the repository variable TIKTOK_AUTOMATION_APPROVED is "true" AND
# TIKTOK_PUBLISH_MODE is "drafts" or "direct", every run is REVIEW ONLY:
# it renders + QA-checks the next video and attaches it to the run as an
# artifact. Nothing is sent to TikTok. See tiktok-studio/README.md.

on:
  schedule:
    - cron: "41 17 * * 1,3,5"   # Mon/Wed/Fri 17:41 UTC: one new video
    - cron: "13 9 * * 0"        # Sunday 09:13 UTC: refresh performance metrics
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [next-video, metrics]
        default: next-video
      publish_mode:
        description: "review = render only; drafts = send to TikTok inbox; direct = post (SELF_ONLY until app audit)"
        type: choice
        options: [review, drafts, direct]
        default: review
      privacy:
        description: "Privacy for direct mode"
        type: choice
        options: [SELF_ONLY, PUBLIC_TO_EVERYONE]
        default: SELF_ONLY

permissions:
  contents: write

concurrency:
  group: tiktok-studio
  cancel-in-progress: false

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tiktok-studio
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Restore studio memory
        run: |
          if git fetch -q origin tiktok-studio-state; then
            git show origin/tiktok-studio-state:history.json > state/history.json
            echo "Restored history ($(grep -c '"run"' state/history.json) runs)"
          else
            echo "No state branch yet: starting fresh"
          fi

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            task="${{ inputs.task }}"
            mode="${{ inputs.publish_mode }}"
            privacy="${{ inputs.privacy }}"
            # A person pressing "Run workflow" with drafts/direct is an explicit, one-off authorisation.
            approved=$([ "$mode" != "review" ] && echo true || echo false)
          else
            task=$([ "${{ github.event.schedule }}" = "13 9 * * 0" ] && echo metrics || echo next-video)
            mode="${{ vars.TIKTOK_PUBLISH_MODE || 'review' }}"
            privacy="${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}"
            approved="${{ vars.TIKTOK_AUTOMATION_APPROVED || 'false' }}"
          fi
          {
            echo "task=$task"; echo "mode=$mode"; echo "privacy=$privacy"; echo "approved=$approved"
          } >> "$GITHUB_OUTPUT"
          echo "task=$task mode=$mode privacy=$privacy approved=$approved"

      - name: Make (and maybe publish) the next video
        id: make
        if: steps.mode.outputs.task == 'next-video'
        env:
          TIKTOK_PUBLISH_MODE: ${{ steps.mode.outputs.mode }}
          TIKTOK_PRIVACY: ${{ steps.mode.outputs.privacy }}
          TIKTOK_AUTOMATION_APPROVED: ${{ steps.mode.outputs.approved }}
        run: python -m studio scheduled

      - name: Refresh metrics
        if: steps.mode.outputs.task == 'metrics'
        run: python -m studio metrics

      - name: Attach video for review
        if: always() && steps.make.outputs.run != ''
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-${{ steps.make.outputs.run }}
          path: |
            tiktok-studio/output/${{ steps.make.outputs.run }}/video.mp4
            tiktok-studio/output/${{ steps.make.outputs.run }}/cover.jpg
            tiktok-studio/output/${{ steps.make.outputs.run }}/contact_sheet.jpg
            tiktok-studio/output/${{ steps.make.outputs.run }}/caption.txt
            tiktok-studio/output/${{ steps.make.outputs.run }}/script.txt
            tiktok-studio/output/${{ steps.make.outputs.run }}/qa_report.json
          retention-days: 30

      - name: Save studio memory
        if: always()
        run: |
          [ -f state/history.json ] || exit 0
          git config user.name "money-quest-studio[bot]"
          git config user.email "money-quest-studio@users.noreply.github.com"
          tmp=$(mktemp -d)
          if git fetch -q origin tiktok-studio-state; then
            git worktree add -q "$tmp" origin/tiktok-studio-state
            git -C "$tmp" checkout -q -B tiktok-studio-state
          else
            git worktree add -q --detach "$tmp"
            git -C "$tmp" checkout -q --orphan tiktok-studio-state
            git -C "$tmp" rm -rfq . || true
          fi
          cp state/history.json "$tmp/history.json"
          git -C "$tmp" add history.json
          git -C "$tmp" commit -qm "studio state: ${{ steps.mode.outputs.task }} ${{ steps.make.outputs.run }}" || { echo "No state change"; exit 0; }
          git -C "$tmp" push -q origin tiktok-studio-state
