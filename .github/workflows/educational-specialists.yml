name: Educational specialist pilot checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest scripts.test_educational_specialists scripts.test_agent_registry -v
      - run: python3 scripts/agent_registry.py --output artifacts/education-specialists/registry-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: education-specialists-registry-check
          path: artifacts/education-specialists/registry-validation.json
