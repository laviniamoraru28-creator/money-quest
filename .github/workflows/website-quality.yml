name: Website completion quality
on:
  push:
    branches: [feature/website-completion-20261027, "release/**", feature/academy-certificates-i18n, main]
  pull_request:
    branches: [main, feature/website-completion-20261027, review/website-completion-20261027, feature/library-first-original-book, feature/public-multilingual-launch, integration/launch-20261102]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  website:
    name: website-node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [24.22.1]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://moneyquesteducation.com
      NEXT_TELEMETRY_DISABLED: 1
      # Isolated test storage and non-production moderation fixture only.
      MONEYQUEST_REVIEW_STORE_PATH: /tmp/moneyquest-ci-reviews.json
      MONEYQUEST_REVIEW_MODERATION_KEY: moneyquest-e2e-moderation-fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Printable build dependencies
        run: python3 -m pip install reportlab==4.4.9 PyMuPDF==1.26.6
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Generate and inspect all 27 certificate PDFs
        run: |
          CERTIFICATE_QA_OUTPUT=certificate-qa node --import tsx scripts/test-academy-certificates.ts
          python3 scripts/inspect-certificate-pdfs.py certificate-qa
      - run: npm run build
      - name: Package and rehearse extracted Namecheap runtime
        run: |
          npm run package:namecheap -- --candidate --output=moneyquest-namecheap-candidate.zip
          node scripts/verify-namecheap-package.mjs moneyquest-namecheap-candidate.zip
      - run: npx playwright install chromium
      - name: Start production server
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Browser journeys and WCAG checks
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test --project=desktop-chrome --project=mobile-chrome --max-failures=8
      - name: Safari certificate downloads on iPhone and iPad
        run: |
          npx playwright install --with-deps webkit
          npx playwright test academy-certificates.spec.ts --project=iphone-safari --project=tablet-safari
      - name: Require complete original-book artwork before release
        run: node --import tsx scripts/test-library-artwork.ts --complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-test-evidence-node-${{ matrix.node }}
          retention-days: 7
          path: |
            certificate-qa/
            test-results/
            server.log
            moneyquest-namecheap-candidate.zip
