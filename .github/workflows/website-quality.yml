name: Website completion quality
on:
  push:
    branches: [feature/website-completion-20261027, "release/**", feature/academy-certificates-i18n, main]
  pull_request:
    branches: [main, feature/website-completion-20261027, review/website-completion-20261027, feature/library-first-original-book, feature/public-multilingual-launch, integration/launch-20261102]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: website-node-24.22.1
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      NEXT_PUBLIC_SITE_URL: https://moneyquesteducation.com
      NEXT_TELEMETRY_DISABLED: 1
      WEBSITE_AUDIT_PROFILE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'broad' || 'essential' }}
      AUDIT_DIR: test-results/audit
      E2E_BASE_URL: http://localhost:3000
      MONEYQUEST_CHECKOUT_PAUSED: "true"
      MONEYQUEST_REVIEW_STORE_PATH: /tmp/moneyquest-ci-reviews.json
      MONEYQUEST_REVIEW_MODERATION_KEY: moneyquest-e2e-moderation-fixture-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Make the apt archive cache directory writable for cache restore/save
        # playwright install --with-deps shells out to `sudo apt-get install`,
        # which is what actually times out here - not the browser binary
        # download. On a fresh runner it has to pull ~126MB across 180+ new
        # packages (WebKit's GStreamer/multimedia dependency chain), and that
        # download alone has twice taken longer than the 22-minute step
        # budget on a slow regional apt mirror (observed ~100KB/s). Caching
        # /var/cache/apt/archives lets apt skip re-downloading .deb files it
        # already has, leaving only the fast local dpkg install. The
        # directory is root-owned by default; actions/cache runs as the
        # unprivileged runner user, so it needs write access to restore/save.
        run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - uses: actions/cache/restore@v4
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: apt-playwright-deps-${{ runner.os }}-24.04-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache/restore@v4
        with:
          path: .website-audit-baseline.json
          key: website-audit-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: website-audit-v1-
      - name: Check monthly schedule window
        id: schedule-gate
        run: |
          # The cron below fires every Monday so a missed week can't push the
          # whole month's audit past its window, but the broad audit (and the
          # monthly Claude review that reads it) is only wanted once a month,
          # preferably the first Monday. Non-schedule events (PRs, pushes,
          # manual dispatch) always proceed; a scheduled run only proceeds
          # when today falls in the first 7 days of the month — exactly one
          # Monday per month satisfies that. Other scheduled Mondays end here
          # cheaply (checkout + this check only), still visible in the Actions
          # history as a quick green run.
          mkdir -p "$AUDIT_DIR"
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          day=$(date -u +%-d)
          if [[ "$day" -le 7 ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not the first Monday of the month (day $day) — skipping this scheduled run. The monthly broad audit runs on the next first Monday." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install project dependencies
        id: setup
        if: "steps.schedule-gate.outputs.should_run == 'true'"
        run: |
          python3 -m pip install reportlab==4.4.9 PyMuPDF==1.26.6
          npm ci
      - run: npm run lint
        id: lint
      - run: npm run typecheck
        id: types
        if: "!cancelled() && steps.setup.outcome == 'success'"
      - name: Redis binaries for assistant ledger tests
        id: redis
        if: "!cancelled() && steps.setup.outcome == 'success'"
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
      - run: WEBSITE_AUDIT_UNIT_JSON="$AUDIT_DIR/unit.json" MQ_TEST_REQUIRE_REDIS="true" npm run test:unit
        id: unit
        if: "!cancelled() && steps.setup.outcome == 'success'"
      - name: Audit educational content and comic asset inventory
        id: content
        if: "!cancelled() && steps.setup.outcome == 'success'"
        run: node --import tsx scripts/website-audit/content.ts "$AUDIT_DIR/content.json"
      - name: Generate and inspect all 27 certificate PDFs
        id: certificates
        if: "!cancelled() && steps.setup.outcome == 'success'"
        run: |
          CERTIFICATE_QA_OUTPUT=certificate-qa node --import tsx scripts/test-academy-certificates.ts
          python3 scripts/inspect-certificate-pdfs.py certificate-qa
      - run: npm run build
        id: build
        if: "!cancelled() && steps.setup.outcome == 'success'"
        timeout-minutes: 12
      - name: Package and rehearse extracted Namecheap runtime
        id: package
        if: "!cancelled() && steps.build.outcome == 'success' && env.WEBSITE_AUDIT_PROFILE == 'essential'"
        timeout-minutes: 5
        run: |
          npm run package:namecheap -- --candidate --output=moneyquest-namecheap-candidate.zip
          node scripts/verify-namecheap-package.mjs moneyquest-namecheap-candidate.zip
      - name: Install Chromium and WebKit
        id: browsers
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 30
      - uses: actions/cache/save@v4
        # Previously gated on `github.event_name == 'schedule'` - but the
        # only scheduled run this workflow has ever had failed in 18
        # seconds (schedule-gate skip), so this cache had never actually
        # been populated by any event, and every pull_request/push run paid
        # the full cold-install cost. Save on any successful install now;
        # GitHub Actions cache scoping still lets every branch read back
        # whatever main's own push-triggered runs save.
        if: "!cancelled() && steps.browsers.outcome == 'success' && steps.browser-cache.outputs.cache-hit != 'true'"
        with:
          path: ~/.cache/ms-playwright
          key: chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache/save@v4
        if: "!cancelled() && steps.browsers.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'"
        with:
          path: /var/cache/apt/archives
          key: apt-playwright-deps-${{ runner.os }}-24.04-${{ hashFiles('package-lock.json') }}
      - name: Start isolated production build
        id: server
        if: "!cancelled() && steps.browsers.outcome == 'success'"
        run: |
          npm run start > "$AUDIT_DIR/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "$E2E_BASE_URL/api/health"; then exit 0; fi
            sleep 1
          done
          cat "$AUDIT_DIR/server.log"
          exit 1
      - name: Chromium journeys and axe checks
        id: chromium
        if: "!cancelled() && steps.server.outcome == 'success'"
        # The 1110s global-timeout this used to carry was calibrated before
        # the Explorer comic suite (90 cases) and the lesson assistant tests
        # landed on main — a push-to-main run timed out with 1125/1172 passed,
        # 0 failed, just 3 tests short of finishing (run 43925505579). Not a
        # real regression, just no longer enough headroom for the suite's
        # current size. 26 minutes gives real margin over the ~19 minutes
        # that run actually needed; the job's own 55-minute ceiling has
        # plenty of room left even at this step's worst case.
        timeout-minutes: 28
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE="$AUDIT_DIR/chromium.json" npx playwright test \
            --project=desktop-chrome --project=mobile-chrome --workers=2 --global-timeout=1560000 \
            --output="$AUDIT_DIR/evidence/chromium" --reporter=line,json
      - name: iPhone and iPad journeys
        id: safari
        if: "!cancelled() && steps.server.outcome == 'success'"
        # The 300s global-timeout this used to carry was calibrated before
        # this spec list grew to 132 cases across iphone-safari and
        # tablet-safari — a broad-profile workflow_dispatch run timed out
        # with 125/132 passed, 0 failed, 7 tests short of finishing (run
        # 45445060163). Not a real regression, the same headroom problem
        # already fixed once for the chromium step above. 12 minutes gives
        # real margin over the ~5 minutes that run actually needed.
        timeout-minutes: 12
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE="$AUDIT_DIR/safari.json" npx playwright test \
            educational-mission.spec.ts cinematic-adventure.spec.ts academy-certificates.spec.ts lesson-assistant.spec.ts settings-panel.spec.ts business-save-and-simulate.spec.ts leadership-retry.spec.ts \
            --project=iphone-safari --project=tablet-safari --workers=2 --global-timeout=600000 \
            --output="$AUDIT_DIR/evidence/safari" --reporter=line,json
      - name: Additional iPad journeys
        id: tablet
        if: "!cancelled() && steps.server.outcome == 'success'"
        timeout-minutes: 6
        run: |
          extra=()
          if [[ "$WEBSITE_AUDIT_PROFILE" == broad ]]; then extra+=(website-audit.spec.ts); fi
          PLAYWRIGHT_JSON_OUTPUT_FILE="$AUDIT_DIR/tablet.json" npx playwright test \
            library-public.spec.ts nav-menu.spec.ts owner-navigation-search.spec.ts site-controls.spec.ts quiet-videos.spec.ts multilingual-release.spec.ts "${extra[@]}" \
            --project=tablet-safari --workers=2 --global-timeout=300000 \
            --output="$AUDIT_DIR/evidence/tablet" --reporter=line,json
      - name: Lighthouse lab samples
        id: lighthouse
        if: "!cancelled() && steps.server.outcome == 'success' && env.WEBSITE_AUDIT_PROFILE == 'broad'"
        timeout-minutes: 4
        run: node scripts/website-audit/lighthouse.mjs "$AUDIT_DIR"
      - name: Require complete published-book artwork before release
        id: artwork
        if: "!cancelled() && steps.setup.outcome == 'success'"
        run: node --import tsx scripts/test-library-artwork.ts --complete
      - name: Generate owner report
        id: report
        if: "!cancelled() && steps.schedule-gate.outputs.should_run == 'true'"
        env:
          WEBSITE_AUDIT_STAGES: >-
            {"setup":"${{ steps.setup.outcome }}","lint":"${{ steps.lint.outcome }}","types":"${{ steps.types.outcome }}","unit":"${{ steps.unit.outcome }}","certificates":"${{ steps.certificates.outcome }}","build":"${{ steps.build.outcome }}","package":"${{ steps.package.outcome }}","browsers":"${{ steps.browsers.outcome }}","browser":"${{ steps.server.outcome }}","chromium":"${{ steps.chromium.outcome }}","safari":"${{ steps.safari.outcome }}","tablet":"${{ steps.tablet.outcome }}","content":"${{ steps.content.outcome }}","lighthouse":"${{ steps.lighthouse.outcome }}","artwork":"${{ steps.artwork.outcome }}"}
        run: |
          node scripts/website-audit/report.mjs "$AUDIT_DIR" .website-audit-baseline.json
          head -n 15 "$AUDIT_DIR/audit-report.md" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **money-quest-audit** under Artifacts for screenshots and findings." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == schedule ]] && node -e 'process.exit(require("./test-results/audit/comparison.json").complete ? 0 : 1)'; then
            cp "$AUDIT_DIR/comparison.json" .website-audit-baseline.json
            echo "save_baseline=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: "!cancelled() && steps.report.outputs.save_baseline == 'true'"
        with:
          path: .website-audit-baseline.json
          key: website-audit-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: "!cancelled() && steps.schedule-gate.outputs.should_run == 'true'"
        with:
          name: money-quest-audit
          retention-days: 35
          path: test-results/audit/
      - uses: actions/upload-artifact@v4
        if: "!cancelled() && steps.schedule-gate.outputs.should_run == 'true'"
        with:
          name: website-test-evidence-node-24.22.1
          retention-days: 7
          path: |
            certificate-qa/
            moneyquest-namecheap-candidate.zip
